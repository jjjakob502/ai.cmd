name: CLI Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-unix:
    name: Test Unix (macOS & Linux)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CLI subcommands and dry-run
        run: |
          set -e
          export AI_ENGINE="echo"
          ./ai.cmd claude
          ./ai.cmd -- echo "hello"
          ./ai.cmd update
          ./ai.cmd build
          ./ai.cmd export backup.tar.gz

      - name: Verify negative security checks
        run: |
          export AI_ENGINE="echo"
          # Refuse to run from HOME without AI_ALLOW_HOME
          if HOME="$(pwd)" ./ai.cmd 2>/dev/null; then
            echo "Expected failure when running from HOME" >&2
            exit 1
          fi

          # Refuse import without input file
          if ./ai.cmd import 2>/dev/null; then
            echo "Expected failure when importing without file" >&2
            exit 1
          fi

          # Refuse sync without target host
          if ./ai.cmd sync push 2>/dev/null; then
            echo "Expected failure when syncing without target" >&2
            exit 1
          fi

      - name: Verify API key, AI_ENV, and AI_ARGS forwarding
        run: |
          set -e
          export AI_ENGINE="echo"
          OUT=$(AI_ENV="CUSTOM_SECRET_KEY" ./ai.cmd claude)
          echo "$OUT" | grep -q "DEEPSEEK_API_KEY"
          echo "$OUT" | grep -q "ANTHROPIC_API_KEY"
          echo "$OUT" | grep -q "CUSTOM_SECRET_KEY"

          OUT_ARGS=$(AI_ARGS="--env-file .env" ./ai.cmd claude)
          echo "$OUT_ARGS" | grep -q -- "--env-file .env"

  test-windows:
    name: Test Windows CMD
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Windows Batch syntax and subcommands
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set AI_ENGINE=echo
          call ai.cmd claude || exit /b 1
          call ai.cmd -- echo hello || exit /b 1
          call ai.cmd update || exit /b 1
          call ai.cmd build || exit /b 1
          call ai.cmd export backup.tar.gz || exit /b 1

      - name: Verify Windows negative checks
        shell: cmd
        run: |
          set AI_ENGINE=echo
          set AI_ALLOW_HOME=

          :: Test missing file on import
          call ai.cmd import 2>nul && (echo Expected failure on missing import && exit /b 1) || echo Import check passed

          :: Test missing target on sync
          call ai.cmd sync push 2>nul && (echo Expected failure on missing sync target && exit /b 1) || echo Sync check passed

          :: Test refusal to run in %USERPROFILE%
          cd /d "%USERPROFILE%"
          call "%GITHUB_WORKSPACE%\ai.cmd" 2>nul && (echo Expected failure in USERPROFILE && exit /b 1) || echo Userprofile check passed
          cd /d "%GITHUB_WORKSPACE%"

      - name: Verify Windows API key, AI_ENV, and AI_ARGS forwarding
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set AI_ENGINE=echo
          set AI_ENV=CUSTOM_SECRET_KEY
          set "FOUND_KEY=0"
          set "FOUND_CUSTOM=0"
          for /f "tokens=*" %%a in ('call ai.cmd claude') do (
              echo "%%a" | findstr /i "DEEPSEEK_API_KEY" >nul && set "FOUND_KEY=1"
              echo "%%a" | findstr /i "CUSTOM_SECRET_KEY" >nul && set "FOUND_CUSTOM=1"
          )
          if "!FOUND_KEY!"=="0" (echo Failed to pass DEEPSEEK_API_KEY && exit /b 1)
          if "!FOUND_CUSTOM!"=="0" (echo Failed to pass CUSTOM_SECRET_KEY && exit /b 1)

          set "FOUND_ARGS=0"
          set "AI_ARGS=--env-file .env"
          for /f "tokens=*" %%a in ('call ai.cmd claude') do (
              echo "%%a" | findstr /i "\-\-env\-file \.env" >nul && set "FOUND_ARGS=1"
          )
          if "!FOUND_ARGS!"=="0" (echo Failed to pass AI_ARGS && exit /b 1)
