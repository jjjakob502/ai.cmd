name: CLI Cross-Platform Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-unix:
    name: Test Unix (macOS & Linux)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CLI subcommands and dry-run
        run: |
          set -e
          export AI_ENGINE="echo"
          ./ai.cmd claude
          ./ai.cmd -- echo "hello"
          ./ai.cmd update
          ./ai.cmd build
          AI_STATE=claude ./ai.cmd export backup.tar.gz

      - name: Verify dockerfile subcommand
        run: |
          set -e
          OUT=$(./ai.cmd dockerfile)
          echo "$OUT" | grep -q '^FROM ubuntu:24.04'
          echo "$OUT" | grep -q 'LABEL org.opencontainers.image.source'
          echo "$OUT" | grep -q 'io.ai-cmd.state-layout="selected-v1"'

      - name: Verify install subcommand and path invocation
        run: |
          set -e
          ./ai.cmd install
          test -x "$HOME/.local/bin/ai"
          export PATH="$HOME/.local/bin:$PATH"
          export AI_ENGINE="echo"
          ai claude | grep -q -- '--network bridge'

      - name: Verify launch network and privilege defaults
        run: |
          set -e
          export AI_ENGINE="echo"
          OUT=$(./ai.cmd claude)
          echo "$OUT" | grep -q -- '--network bridge'
          echo "$OUT" | grep -q -- '--cap-drop=ALL'
          echo "$OUT" | grep -q -- '--security-opt=no-new-privileges'
          AI_NETWORK=host ./ai.cmd claude | grep -q -- '--network host'

      - name: Verify negative security checks
        run: |
          export AI_ENGINE="echo"
          # Refuse to run from HOME without AI_ALLOW_HOME
          if HOME="$(pwd)" ./ai.cmd 2>/dev/null; then
            echo "Expected failure when running from HOME" >&2
            exit 1
          fi

          # Refuse import without input file
          if ./ai.cmd import 2>/dev/null; then
            echo "Expected failure when importing without file" >&2
            exit 1
          fi

          # Refuse sync without target host
          if ./ai.cmd sync push 2>/dev/null; then
            echo "Expected failure when syncing without target" >&2
            exit 1
          fi

      - name: Verify AI_ENV and AI_ARGS forwarding, no implicit API keys
        run: |
          set -e
          export AI_ENGINE="echo"
          OUT=$(AI_ENV="CUSTOM_SECRET_KEY" ./ai.cmd claude)
          # Host keys are shared only when named in AI_ENV.
          ! ANTHROPIC_API_KEY=x ./ai.cmd claude | grep -q "ANTHROPIC_API_KEY"
          echo "$OUT" | grep -q "CUSTOM_SECRET_KEY"

          OUT_ARGS=$(AI_ARGS="--env-file .env" ./ai.cmd claude)
          echo "$OUT_ARGS" | grep -q -- "--env-file .env"

      - name: Real Docker E2E execution (Linux native engine)
        if: runner.os == 'Linux'
        run: |
          set -e
          # Build minimal base image via embedded Dockerfile with no heavy AI CLIs (fast build)
          AI_CLIS="none" ./ai.cmd build

          # Test live container execution with non-root user and drop-caps
          OUT=$(./ai.cmd -- id)
          echo "$OUT" | grep -q "uid="

          # Test workspace mount and write permissions
          ./ai.cmd -- touch e2e-test-marker.txt
          test -f e2e-test-marker.txt
          rm -f e2e-test-marker.txt

          # Initialize state volume before export test
          AI_STATE=claude ./ai.cmd -- true

          # Test export against real container volume
          AI_STATE=claude ./ai.cmd export /tmp/test-state.tar.gz
          test -f /tmp/test-state.tar.gz
          AI_STATE=claude ./ai.cmd import /tmp/test-state.tar.gz --overwrite
          rm -f /tmp/test-state.tar.gz

  test-windows:
    name: Test Windows CMD
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Windows Batch syntax and subcommands
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set AI_ENGINE=echo
          call ai.cmd claude || exit /b 1
          call ai.cmd -- echo hello || exit /b 1
          call ai.cmd update || exit /b 1
          call ai.cmd build || exit /b 1
          set AI_STATE=claude
          call ai.cmd export backup.tar.gz || exit /b 1

      - name: Verify Windows dockerfile subcommand
        shell: cmd
        run: |
          call ai.cmd dockerfile > dockerfile_out.txt || exit /b 1
          findstr /b /c:"FROM ubuntu:24.04" dockerfile_out.txt >nul || exit /b 1
          findstr /l /c:"io.ai-cmd.state-layout" dockerfile_out.txt >nul || exit /b 1

      - name: Verify Windows install subcommand
        shell: cmd
        run: |
          call ai.cmd install || exit /b 1
          if not exist "%LOCALAPPDATA%\Microsoft\WindowsApps\ai.cmd" (
              echo WindowsApps ai.cmd not found & exit /b 1
          )
          set AI_ENGINE=echo
          call "%LOCALAPPDATA%\Microsoft\WindowsApps\ai.cmd" claude > installed_out.txt || exit /b 1
          findstr /l /c:"--network bridge" installed_out.txt >nul || exit /b 1

      - name: Verify Windows launch network and privilege defaults
        shell: cmd
        run: |
          set AI_ENGINE=echo
          call ai.cmd claude > launch.txt || exit /b 1
          findstr /l /c:"--network bridge" launch.txt >nul || exit /b 1
          findstr /l /c:"--cap-drop=ALL" launch.txt >nul || exit /b 1
          findstr /l /c:"--security-opt=no-new-privileges" launch.txt >nul || exit /b 1
          set AI_NETWORK=host
          call ai.cmd claude > launch-host.txt || exit /b 1
          findstr /l /c:"--network host" launch-host.txt >nul || exit /b 1

      - name: Verify Windows negative checks
        shell: cmd
        run: |
          set AI_ENGINE=echo
          set AI_ALLOW_HOME=

          :: Test missing file on import
          call ai.cmd import 2>nul && (echo Expected failure on missing import && exit /b 1) || echo Import check passed

          :: Test missing target on sync
          call ai.cmd sync push 2>nul && (echo Expected failure on missing sync target && exit /b 1) || echo Sync check passed

          :: Test refusal to run in %USERPROFILE%
          cd /d "%USERPROFILE%"
          call "%GITHUB_WORKSPACE%\ai.cmd" 2>nul && (echo Expected failure in USERPROFILE && exit /b 1) || echo Userprofile check passed
          cd /d "%GITHUB_WORKSPACE%"

      - name: Verify Windows AI_ENV and AI_ARGS forwarding, no implicit API keys
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set AI_ENGINE=echo
          set AI_ENV=CUSTOM_SECRET_KEY
          set "FOUND_KEY=0"
          set "FOUND_CUSTOM=0"
          for /f "tokens=*" %%a in ('call ai.cmd claude') do (
              echo "%%a" | findstr /i "ANTHROPIC_API_KEY" >nul && set "FOUND_KEY=1"
              echo "%%a" | findstr /i "CUSTOM_SECRET_KEY" >nul && set "FOUND_CUSTOM=1"
          )
          if "!FOUND_KEY!"=="1" (echo ANTHROPIC_API_KEY forwarded without AI_ENV && exit /b 1)
          if "!FOUND_CUSTOM!"=="0" (echo Failed to pass CUSTOM_SECRET_KEY && exit /b 1)

          set "FOUND_ARGS=0"
          set "AI_ARGS=--env-file .env"
          for /f "tokens=*" %%a in ('call ai.cmd claude') do (
              echo "%%a" | findstr /i "\-\-env\-file \.env" >nul && set "FOUND_ARGS=1"
          )
          if "!FOUND_ARGS!"=="0" (echo Failed to pass AI_ARGS && exit /b 1)
